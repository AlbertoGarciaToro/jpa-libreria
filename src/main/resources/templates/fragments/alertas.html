<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alerta</title>
</head>
<body>

<div th:fragment="alerta-exito">
    <div th:if="${success}" id="alertaExito" class="alert alert-success alert-dismissible fade show" role="alert" style="margin-top: 15px;">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

</body>
</html>
