<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<div class="container-fluid">
    <main class="container text-center col-md-10 p-4 shadow-lg p-3 mb-5 bg-body-tertiary rounded">
        <h1 th:text="${contenido}"></h1>
        <div class="card-body">
            <form th:action="@{/libro/salvar-libro}" th:object="${libro}" method="post" novalidate>
                <div th:if="${#fields.hasErrors('*')}" class='alert alert-danger' role="alert">
                    Verifique los siguientes errores
                    <ul>
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"/>
                    </ul>
                </div>
                <div class="row gx-5">

                    <div class="col-md-5">
                        <div class="form-group">
                            <label for="titulo">Titulo:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('titulo')}? 'form-control is-invalid':form-control"
                                   id="titulo" name="titulo"
                                   placeholder="Nombre del titulo" required="required"
                                   th:field="*{titulo}">
                        </div>
                    </div>

                    <div class="col-md-5">
                        <div class="form-group">
                            <label for="autor">Autor:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('autor')}? 'form-control is-invalid':form-control"
                                   id="autor" name="autor"
                                   placeholder="Nombre del autor" required="required"
                                   th:field="*{autor}">
                        </div>
                    </div>

                        <div class="col-md-2">
                        <div class="form-group">
                            <label for="isbn">ISBN:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('isbn')}? 'form-control is-invalid':form-control"
                                   id="isbn" name="isbn"
                                   placeholder="id: isbn" required="required"
                                   th:field="*{isbn}">
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="form-group">
                            <label for="precio">Precio:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('precio')}? 'form-control is-invalid':form-control"
                                   id="precio" name="precio"
                                   pattern="^\d*(\.\d{0,2})?$"
                                   placeholder="Precio" required="required"
                                   th:field="*{precio}">
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="form-group">
                            <label for="precio">Stock:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('stock')}? 'form-control is-invalid':form-control"
                                   id="stock" name="stock"
                                   placeholder="stock" required="required"
                                   th:field="*{stock}">
                        </div>
                    </div>


                    <div class="col-md-12">
                        <br/>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </div>
                <input type="hidden" name="id" th:value="${libro.id}"/>
            </form>
        </div>

    </main>
</div>
<footer th:replace="~{plantillas/plantilla::footer}"></footer>

</body>
</html>
