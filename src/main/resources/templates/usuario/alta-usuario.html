<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">

<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>

<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container text-center col-md-10 p-4 shadow-lg p-3 mb-5 bg-body-tertiary rounded">

        <h1 th:text="${contenido}"></h1>

        <div class="card-body">
            <form th:action="@{/usuario/salvar-usuario}" th:object="${usuario}" method="post">

                <div th:if="${#fields.hasErrors('*')}" class='alert alert-danger' role="alert">
                    Verifique los siguientes errores
                    <ul>
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"/>
                    </ul>
                </div>

                <div class="row gx-5">
                    <div class="col-md-5">
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('nombre')}? 'form-control is-invalid':form-control"
                                   id="nombre" name="nombre"
                                   placeholder="Nombre del usuario" required="required"
                                   th:field="*{nombre}">
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('email')}? 'form-control is-invalid':form-control"
                                   id="email" name="email"
                                   placeholder="Email" required="required"
                                   th:field="*{email}">
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="form-group">
                            <label for="telefono">Telefono:</label>
                            <input type="text"
                                   th:class="${#fields.hasErrors('telefono')}? 'form-control is-invalid':form-control"
                                   id="telefono" name="telefono"
                                   placeholder="Telefono" required="required"
                                   th:field="*{telefono}">
                        </div>
                    </div>

                    <div class="col-md-12">
                        <br/>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </div>
                <input type="hidden" name="id" th:value="${usuario.id}"/>
            </form>
        </div>

    </main>
</div>
<footer th:replace="~{plantillas/plantilla::footer}"></footer>

</body>
</html>
