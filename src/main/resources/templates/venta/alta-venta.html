<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">

<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>

<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container text-center col-md-10 p-4 shadow-lg p-3 mb-5 bg-body-tertiary rounded">

        <h1 th:text="${contenido}"></h1>

        <div class="card-body">

<!--            para guardar uno modificado-->
            <form th:action="@{/venta/salvar-venta}" th:object="${venta}" method="post" novalidate>

                <div th:if="${#fields.hasErrors('*')}" class='alert alert-danger' role="alert">
                    Verifique los siguientes errores
                    <ul>
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"/>
                    </ul>
                </div>

                <div class="row gx-5">
                    <div class="col-md-5">
                        <div class="form-group">
                            <label for="fecha">Fecha:</label>
                            <input type="datetime-local"
                                   th:class="${#fields.hasErrors('fecha')}? 'form-control is-invalid':form-control"
                                   id="fecha" name="fecha"
                                   placeholder="Fecha de venta" required="required"
                                   th:field="*{fecha}">
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="form-group">
                            <label for="cantidad">Cantidad:</label>
                            <input type="number"
                                   min="1"
                                   th:class="${#fields.hasErrors('cantidad')}? 'form-control is-invalid':form-control"
                                   id="cantidad" name="cantidad"
                                   placeholder="Cantidad" required="required"
                                   th:field="*{cantidad}">
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="form-group">
                            <label for="total">Total:</label>
                            <input type="number"
                                   th:class="${#fields.hasErrors('total')}? 'form-control is-invalid':form-control"
                                   id="total" name="total"
                                   step="0.01"
                                   min="0"
                                   placeholder="Total" required="required"
                                   th:field="*{total}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="usuario">Usuario:</label>
                            <select class="form-control" id="usuario" th:field="*{usuarioId}" required>
                                <option value="">Seleccione un usuario...</option>
                                <option th:each="u : ${usuarios}"
                                        th:value="${u.id}"
                                        th:text="${u.nombre}">
                                </option>
                            </select>
                        </div>
                    </div>


                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="libro">Libro:</label>
                            <select class="form-control" id="libro" th:field="*{libroId}" required>
                                <option value="">Seleccione un libro...</option>
                                <option th:each="l : ${libros}"
                                        th:value="${l.id}"
                                        th:text="${l.titulo}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <br/>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </div>
                <input type="hidden" th:field="*{id}"/>
            </form>
        </div>

    </main>
</div>
<footer th:replace="~{plantillas/plantilla::footer}"></footer>

</body>
</html>
