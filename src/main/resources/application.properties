spring.application.name=jpa

#Conexion a mariadb
spring.datasource.url=jdbc:mariadb://localhost:3306/jpa?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


#ruta de archivos
ejemplo.imagen.ruta=/home/alberto/img/


# aumentar el tamano máximo permitido por cada archivo
spring.servlet.multipart.max-file-size=10MB

# aumentar el tamano maximo permitido para toda la petición completa
spring.servlet.multipart.max-request-size=10MB